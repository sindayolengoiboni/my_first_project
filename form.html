<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Order Form</title>
  <style>
    body {
      background-color: #E6E6FA;
      font-family: Arial, sans-serif;
    }
    form {
      width: 50%;
      margin: auto;
    }
    fieldset {
      margin-bottom: 20px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    legend {
      font-weight: bold;
    }
    label {
      display: block;
      margin: 5px 0;
    }
    input[type="submit"] {
      padding: 10px 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Customer Order Form</h2>
  <form method="post" action="mailto:paulinesindayo@gmail.com?subject=Customer%20Order" enctype="text/plain">
    
    <fieldset>
      <legend>Personal Information</legend>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email address:</label>
      <input type="email" id="email" name="email" required>

      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="Male">
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="Female">
      <label for="female">Female</label>
    </fieldset>

    <fieldset>
      <legend>Order Details</legend>
      <label>Pizza Size:</label>
      <input type="radio" id="pizza-large" name="pizza_size" value="Large">
      <label for="pizza-large">Large</label>
      <input type="radio" id="pizza-medium" name="pizza_size" value="Medium">
      <label for="pizza-medium">Medium</label>
      <input type="radio" id="pizza-small" name="pizza_size" value="Small">
      <label for="pizza-small">Small</label>

      <label>Ice Cream Size:</label>
      <input type="radio" id="icecream-large" name="ice_cream_size" value="Large">
      <label for="icecream-large">Large</label>
      <input type="radio" id="icecream-medium" name="ice_cream_size" value="Medium">
      <label for="icecream-medium">Medium</label>
      <input type="radio" id="icecream-small" name="ice_cream_size" value="Small">
      <label for="icecream-small">Small</label>

      <label>Favourite Flavour(s):</label>
      <input type="checkbox" id="vanilla" name="flavour" value="Vanilla">
      <label for="vanilla">Vanilla</label>
      <input type="checkbox" id="chocolate" name="flavour" value="Chocolate">
      <label for="chocolate">Chocolate</label>
      <input type="checkbox" id="strawberry" name="flavour" value="Strawberry">
      <label for="strawberry">Strawberry</label>
    </fieldset>

    <fieldset>
      <legend>Payment and Delivery</legend>
      <label for="payment">Mode of Payment:</label>
      <select id="payment" name="payment_method" required>
        <option value="">--Select--</option>
        <option value="ATM card">ATM Card</option>
        <option value="Mpesa">Mpesa</option>
        <option value="Cash">Cash</option>
      </select>

      <label for="destination">Delivery Destination:</label>
      <select id="destination" name="delivery_area" required>
        <option value="">--Select--</option>
        <option value="Kayole">Kayole</option>
        <option value="Siaya">Siaya</option>
        <option value="Kiambu">Kiambu</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Browser Used</legend>
      <label for="browser">Choose your browser:</label>
      <input list="browsers" name="browser" id="browser">
      <datalist id="browsers">
        <option value="Internet Explorer">
        <option value="Firefox">
        <option value="Chrome">
        <option value="Opera">
      </datalist>
    </fieldset>

    <p style="text-align:center;">
      <input type="submit" value="Submit Order">
    </p>
  </form>
</body>
</html>
